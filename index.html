  <script>
    let currentFontSize = 15;

    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(currentFontSize + delta, 12), 22);
      document.getElementById('readingText').style.fontSize = currentFontSize + 'px';
    }

    function formatMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    async function submitReading(isRemedyUnlocked = false) {
      const name = document.getElementById('fullName').value.trim();
      const dob = document.getElementById('dob').value;
      const tob = document.getElementById('tob').value;
      const pob = document.getElementById('pob').value.trim();
      const question = document.getElementById('question').value.trim();

      if (!name) {
        alert("Please enter your name.");
        return;
      }
      if (!dob || !tob || !pob) {
        alert("Please provide complete birth details (Date, Time, and Place of Birth).");
        return;
      }

      const btnSubmit = document.getElementById('btnSubmit');
      const btnRemedy = document.getElementById('btnUnlockRemedy');
      const loader = document.getElementById('loader');
      const resultsCard = document.getElementById('resultsCard');
      const readingText = document.getElementById('readingText');
      const remedyBox = document.getElementById('remedyBox');
      const gender = document.getElementById('gender').value;
      const language = document.getElementById('language').value;

      btnSubmit.disabled = true;
      if (btnRemedy) btnRemedy.disabled = true;
      loader.style.display = 'block';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            gender,
            dob,
            tob,
            pob,
            language,
            question: question || "Please provide an overview of my current planetary phase and life path.",
            unlockedRemedy: isRemedyUnlocked
          })
        });

        const data = await res.json();
        loader.style.display = 'none';
        btnSubmit.disabled = false;
        if (btnRemedy) btnRemedy.disabled = false;

        if (data.answer) {
          readingText.innerHTML = formatMarkdown(data.answer);
          resultsCard.style.display = 'block';

          // Explicitly toggle button visibility based on unlock status
          if (isRemedyUnlocked) {
            remedyBox.style.display = 'none';
          } else {
            remedyBox.style.display = 'block';
          }

          resultsCard.scrollIntoView({ behavior: 'smooth' });
        } else {
          readingText.innerHTML = '<span style="color: #b00020;">Unable to load reading. Please try again.</span>';
          resultsCard.style.display = 'block';
        }
      } catch (err) {
        loader.style.display = 'none';
        btnSubmit.disabled = false;
        if (btnRemedy) btnRemedy.disabled = false;
        readingText.innerHTML = '<span style="color: #b00020;">Connection error: ' + err.message + '</span>';
        resultsCard.style.display = 'block';
      }
    }
  </script>
