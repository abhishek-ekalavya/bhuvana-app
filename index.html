<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHUVANA - The Truth Behind Your Chart</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8E7] min-h-screen p-3">
<div id="app" class="max-w-md mx-auto"></div>

<script>
let chart = null;
let saved = localStorage.getItem("bhuvana_chart_v2");
if(saved){ chart = JSON.parse(saved); }

function showForm(){
  document.getElementById("app").innerHTML = `
    <h1 class="text-3xl font-bold text-center mt-8">🕉️ BHUVANA</h1>
    <p class="text-center text-sm mt-2">Vedic • KP • Lal Kitab • Private to your phone</p>
    <div class="bg-white rounded-2xl p-6 mt-8 shadow-xl">
      <h2 class="font-bold text-lg">Enter Your Birth Details</h2>
      <p class="text-xs text-gray-500 mb-4">New user? Start here. Your chart stays on your device only.</p>
      <input id="name" class="w-full border rounded-lg p-3 mt-3" placeholder="Full Name">
      <input id="dob" class="w-full border rounded-lg p-3 mt-3" type="date" value="1993-01-04">
      <label class="text-xs ml-1">Birth Time</label>
      <input id="tob" class="w-full border rounded-lg p-3 mt-1" type="time" value="15:45">
      <input id="pob" class="w-full border rounded-lg p-3 mt-3" placeholder="Birth Place - Mumbai">
      <button onclick="calcChart()" class="w-full bg-black text-white rounded-xl p-4 mt-6 font-bold">Get My Kundli + Chat →</button>
      <p class="text-[10px] text-center mt-3 text-gray-400">No login needed. 100% private.</p>
    </div>
  `;
}

function calcChart(){
  const name = document.getElementById("name").value || "User";
  const dob = document.getElementById("dob").value;
  const tob = document.getElementById("tob").value;
  const pob = document.getElementById("pob").value || "Mumbai";
  if(!dob || !tob){ alert("Enter Date and Time"); return; }
  
  // Your real chart - keep same as your app, this is your Leo example - for new users replace logic later
  chart = {
    name: name,
    lagna: "Leo",
    moon: "Libra",
    context: `Leo Lagna, Sun own house, Mercury Leo Purva Phalguni, Venus Leo, Jupiter Libra Vishakha, Saturn Libra Vishakha EXALTED in 3rd, Mars Gemini, Rahu Aquarius, Ketu Leo. User: ${name}, DOB ${dob} ${tob} ${pob}`,
    planets: [
      ["Sun","Leo (Own) House 1"],
      ["Mercury","Leo Purva Phalguni H1"],
      ["Venus","Leo H1"],
      ["Jupiter","Libra Vishakha H3"],
      ["Saturn","Libra EXALTED H3"],
      ["Mars","Gemini H11"],
      ["Rahu","Aquarius H7"],
      ["Ketu","Leo H1"]
    ]
  };
  localStorage.setItem("bhuvana_chart_v2", JSON.stringify(chart));
  showChart();
}

function showChart(){
  let planetsHtml = chart.planets.map(p=>`<div class="flex justify-between border-b py-1 text-xs"><span>${p[0]}</span><span>${p[1]}</span></div>`).join("");
  document.getElementById("app").innerHTML = `
    <div class="bg-white rounded-2xl p-4 shadow">
      <div class="flex justify-between"><h1 class="font-bold">🕉️ BHUVANA - ${chart.name}</h1><button onclick="recalc()" class="text-xs underline">← New Chart</button></div>
      <div class="mt-4 border rounded-xl p-3 text-sm"><p><b>Lagna:</b> ${chart.lagna} | <b>Moon:</b> ${chart.moon}</p>${planetsHtml}</div>
      <div class="mt-6">
        <p class="font-bold text-sm">💬 Ask BHUVANA - Your Chart Knows You</p>
        <div class="flex gap-2 mt-2 flex-wrap">
          <button onclick="quickAsk('When will my new firm Ekalavya make money?')" class="text-xs border rounded-full px-3 py-1">When money?</button>
          <button onclick="quickAsk('Career next 6 months?')" class="text-xs border rounded-full px-3 py-1">Career 6 months?</button>
          <button onclick="quickAsk('Lal Kitab remedy for Saturn?')" class="text-xs border rounded-full px-3 py-1">Saturn remedy?</button>
        </div>
        <div id="ans" class="mt-4 hidden bg-[#FFF3D6] rounded-xl p-3 text-sm whitespace-pre-wrap"></div>
        <div id="load" class="hidden mt-3 text-sm">BHUVANA is reading your chart live... 🙏</div>
        <div class="flex gap-2 mt-4">
          <input id="q" placeholder="Ask: Career, money, marriage..." class="flex-1 border rounded-xl p-3 text-sm">
          <button onclick="ask()" class="bg-[#3E2723] text-white rounded-xl px-5 font-bold">Ask</button>
        </div>
        <p class="text-[10px] text-center mt-3 text-gray-400">Chart saved only on this phone. Share link = friend sees their own form.</p>
      </div>
    </div>
  `;
}

function recalc(){
  localStorage.removeItem("bhuvana_chart_v2");
  chart = null;
  showForm();
}

function quickAsk(q){
  document.getElementById("q").value = q;
  ask();
}

async function ask(){
  const q = document.getElementById("q").value;
  if(!q) return;
  document.getElementById("load").classList.remove("hidden");
  document.getElementById("ans").classList.add("hidden");
  try{
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ question: q, chartContext: chart.context })
    });
    const data = await res.json();
    document.getElementById("ans").innerText = data.answer;
    document.getElementById("ans").classList.remove("hidden");
  }catch(e){
    document.getElementById("ans").innerText = "Error: "+e.message;
    document.getElementById("ans").classList.remove("hidden");
  }
  document.getElementById("load").classList.add("hidden");
}

if(chart){ showChart(); } else { showForm(); }
</script>
</body>
</html>
