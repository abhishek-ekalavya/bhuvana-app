<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHUVANA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8E7] min-h-screen p-3">
<div id="app" class="max-w-md mx-auto"></div>
<script>
let chart=null;
try{let s=localStorage.getItem("bhuvana_chart_v2");if(s)chart=JSON.parse(s);}catch(e){localStorage.clear();chart=null;}
function showForm(){
document.getElementById("app").innerHTML=`<h1 class="text-3xl font-bold text-center mt-8">🕉️ BHUVANA</h1><p class="text-center text-xs mt-2">Private to your phone</p><div class="bg-white rounded-2xl p-6 mt-8 shadow-xl"><h2 class="font-bold">Enter Birth Details</h2><input id="name" class="w-full border rounded-lg p-3 mt-3" placeholder="Full Name"><input id="dob" class="w-full border rounded-lg p-3 mt-3" type="date" value="1993-01-04"><input id="tob" class="w-full border rounded-lg p-3 mt-3" type="time" value="15:45"><input id="pob" class="w-full border rounded-lg p-3 mt-3" placeholder="Mumbai"><button onclick="calc()" class="w-full bg-black text-white rounded-xl p-4 mt-6 font-bold">Get My Kundli →</button><button onclick="localStorage.clear();location.reload();" class="w-full text-xs mt-3 underline">Clear Data</button></div>`;
}
function calc(){
const name=document.getElementById("name").value||"User";
const dob=document.getElementById("dob").value;const tob=document.getElementById("tob").value;const pob=document.getElementById("pob").value||"Mumbai";
chart={name:name,lagna:"Leo",context:`Leo Lagna Sun own, Mercury Leo, Venus Leo, Jupiter Libra Vishakha, Saturn EXALTED 3rd, Mars Gemini, Rahu Aquarius. User ${name} DOB ${dob} ${tob} ${pob}`,planets:[["Sun","Leo Own"],["Mercury","Leo"],["Venus","Leo"],["Saturn","EXALTED Libra H3"],["Jupiter","Libra H3"],["Mars","Gemini H11"]]};
localStorage.setItem("bhuvana_chart_v2",JSON.stringify(chart));showChart();
}
function showChart(){
let ph=chart.planets.map(p=>`<div class="flex justify-between border-b py-1 text-xs"><span>${p[0]}</span><span>${p[1]}</span></div>`).join("");
document.getElementById("app").innerHTML=`<div class="bg-white rounded-2xl p-4 shadow"><div class="flex justify-between"><b>🕉️ ${chart.name}</b><button onclick="localStorage.clear();location.reload();" class="text-xs underline">← New</button></div><div class="mt-3 border rounded-xl p-3 text-sm"><b>Lagna:</b> ${chart.lagna}${ph}</div><div class="mt-6"><p class="font-bold text-sm">Ask BHUVANA</p><div id="ans" class="mt-3 hidden bg-[#FFF3D6] rounded-xl p-3 text-sm whitespace-pre-wrap"></div><div id="load" class="hidden mt-2 text-sm">Reading...</div><div class="flex gap-2 mt-4"><input id="q" placeholder="When will money come?" class="flex-1 border rounded-xl p-3 text-sm"><button onclick="ask()" class="bg-black text-white rounded-xl px-5">Ask</button></div></div></div>`;
}
async function ask(){
const q=document.getElementById("q").value;if(!q)return;document.getElementById("load").classList.remove("hidden");
try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,chartContext:chart.context})});const d=await r.json();document.getElementById("ans").innerText=d.answer;document.getElementById("ans").classList.remove("hidden");}catch(e){document.getElementById("ans").innerText="Error";document.getElementById("ans").classList.remove("hidden");}
document.getElementById("load").classList.add("hidden");
}
if(chart&&chart.name)showChart();else showForm();
</script>
</body>
</html>
