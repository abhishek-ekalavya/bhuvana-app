<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BHUVANA Vedic AI</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{margin:0;font-family:system-ui;background:#FFF7E6}
    input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin:5px 0 15px 0;box-sizing:border-box;font-size:16px}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    function App() {
      const [dob, setDob] = useState('1990-01-01');
      const [tob, setTob] = useState('12:00');
      const [pob, setPob] = useState('Mumbai, India');
      const [question, setQuestion] = useState('Launched my firm Ekalavya Consulting, when will I have first client and massive profits?');
      const [language, setLanguage] = useState('english');
      const [answer, setAnswer] = useState('');
      const [loading, setLoading] = useState(false);
      const [fontSize, setFontSize] = useState(18);

      async function askAstro() {
        setLoading(true);
        setAnswer('');
        try {
          const chartContext = `Leo Lagna Sun Mercury Venus Leo H1, Saturn EXALTED Libra H3, Jupiter Libra H3, Mars Gemini H11. DOB ${dob} TOB ${tob} POB ${pob}. Today Oct 2026. Ekalavya Consulting marketing consulting firm.`;
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, chartContext, language })
          });
          const data = await res.json();
          setAnswer(data.answer);
        } catch(e) {
          setAnswer('Error. But reading: Saturn Mahadasha exalted 3rd tested 18 months. Dec 2026 first client via referral, Feb-Mar 2027 stability, Apr-Jun 2027 massive profit Jupiter transit Gemini 11th.');
        }
        setLoading(false);
      }

      return (
        <div style={{maxWidth:"600px", margin:"0 auto", padding:"20px"}}>
          <h1 style={{textAlign:"center", color:"#8B4513"}}>🔮 BHUVANA Vedic AI</h1>
          <div style={{background:"white", padding:"20px", borderRadius:"12px"}}>
            <label>DOB</label>
            <input type="date" value={dob} onChange={e=>setDob(e.target.value)} />
            <label>Time of Birth</label>
            <input type="time" value={tob} onChange={e=>setTob(e.target.value)} />
            <label>Place of Birth</label>
            <input value={pob} onChange={e=>setPob(e.target.value)} />
            <label style={{fontWeight:"bold"}}>Answer Language:</label>
            <select value={language} onChange={e=>setLanguage(e.target.value)}>
              <option value="english">English</option>
              <option value="hi">Hindi</option>
              <option value="hinglish">Hinglish</option>
            </select>
            <label style={{fontWeight:"bold"}}>Your Question:</label>
            <textarea value={question} onChange={e=>setQuestion(e.target.value)} rows={3} />
            <button onClick={askAstro} disabled={loading} style={{width:"100%", padding:"15px", marginTop:"15px", background:"#FF8C00", color:"white", border:"none", borderRadius:"10px", fontSize:"18px", fontWeight:"bold", cursor:"pointer"}}>
              {loading ? "Consulting Stars..." : "ASK BHUVANA"}
            </button>
          </div>
          {answer && (
            <div style={{marginTop:"20px", background:"#FFFACD", border:"2px solid #FFD700", padding:"15px", borderRadius:"12px"}}>
              <div style={{display:"flex", justifyContent:"space-between"}}>
                <b>Your Reading:</b>
                <div><button onClick={()=>setFontSize(s=>Math.min(26,s+2))}>A+</button><button onClick={()=>setFontSize(s=>Math.max(14,s-2))} style={{marginLeft:"5px"}}>A-</button></div>
              </div>
              <div style={{whiteSpace:"pre-wrap", fontSize:fontSize, lineHeight:"1.6", marginTop:"10px"}}>{answer}</div>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
