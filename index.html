<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BHUVANA - Vedic & KP Astrology</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #FFF7E6;
    color: #2D2319;
  }
  input, select, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #D6C2A5;
    margin: 6px 0 14px 0;
    box-sizing: border-box;
    font-size: 15px;
    background: #FFFCF7;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #8B4513;
  }
  label {
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: #5a3e1b;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [dob, setDob] = useState(localStorage.getItem('bhuvana_dob') || '');
  const [tob, setTob] = useState(localStorage.getItem('bhuvana_tob') || '');
  const [pob, setPob] = useState(localStorage.getItem('bhuvana_pob') || '');
  const [lang, setLang] = useState(localStorage.getItem('bhuvana_lang') || 'english');
  const [q, setQ] = useState(localStorage.getItem('bhuvana_q') || '');
  
  const [ans, setAns] = useState('');
  const [remedyAns, setRemedyAns] = useState('');
  const [loading, setLoading] = useState(false);
  const [remedyLoading, setRemedyLoading] = useState(false);
  const [fs, setFs] = useState(16);

  useEffect(() => { if (dob) localStorage.setItem('bhuvana_dob', dob); }, [dob]);
  useEffect(() => { if (tob) localStorage.setItem('bhuvana_tob', tob); }, [tob]);
  useEffect(() => { if (pob) localStorage.setItem('bhuvana_pob', pob); }, [pob]);
  useEffect(() => { if (lang) localStorage.setItem('bhuvana_lang', lang); }, [lang]);
  useEffect(() => { if (q) localStorage.setItem('bhuvana_q', q); }, [q]);

  async function askReading() {
    if (!dob || !tob || !pob) {
      return alert('Please enter your Date, Time, and Place of Birth.');
    }
    if (!q) {
      return alert('Please enter your question.');
    }
    setLoading(true);
    setAns('');
    setRemedyAns('');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          dob,
          tob,
          pob,
          question: q,
          language: lang,
          unlockedRemedy: false
        })
      });
      const data = await res.json();
      setAns(data.answer);
    } catch (e) {
      setAns('Error connecting to engine: ' + e.message);
    }
    setLoading(false);
  }

  async function unlockRemedyProtocol() {
    setRemedyLoading(true);
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          dob,
          tob,
          pob,
          question: q,
          language: lang,
          unlockedRemedy: true
        })
      });
      const data = await res.json();
      setRemedyAns(data.answer);
    } catch (e) {
      setRemedyAns('Error fetching remedy protocol: ' + e.message);
    }
    setRemedyLoading(false);
  }

  return (
    <div style={{maxWidth: "600px", margin: "0 auto", padding: "16px 14px 40px 14px"}}>
      <div style={{textAlign: "center", marginBottom: "16px"}}>
        <h1 style={{margin: "4px 0", color: "#8B4513", fontSize: "26px", fontWeight: "800"}}>
          🔮 BHUVANA
